<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>qsyy passport</title>
<script src="/security/sdk-glue.js"></script>
<script>
window._SdkGlueInit({
  self: { aid: 386088, pageId: 24554 },
  bdms: { aid: 386088, paths: ['/passport'] },
});

window.__qishuiRequest = function (request) {
  return new Promise(function (resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open(request.method || 'GET', request.url, true);
    xhr.withCredentials = true;
    var headers = request.headers || {};
    Object.keys(headers).forEach(function (name) {
      if (/^(cookie|user-agent|host|content-length|origin|referer)$/i.test(name)) return;
      xhr.setRequestHeader(name, String(headers[name]));
    });
    xhr.timeout = request.timeout || 20000;
    xhr.onload = function () {
      resolve({
        status: xhr.status,
        body: xhr.responseText,
        responseURL: xhr.responseURL,
        headers: xhr.getAllResponseHeaders(),
      });
    };
    xhr.onerror = function () { reject(new Error('XMLHttpRequest network error')); };
    xhr.ontimeout = function () { reject(new Error('XMLHttpRequest timeout')); };
    xhr.send(request.body == null ? null : request.body);
  });
};

function parseJson(text) {
  try { return JSON.parse(text); } catch (e) { return null; }
}

function aBogusOf(url) {
  try { return new URL(String(url || ''), location.href).searchParams.get('a_bogus') || ''; }
  catch (e) { return ''; }
}

window.qsyyWhenReady = function (timeout) {
  var limit = timeout || 20000;
  var start = Date.now();
  return new Promise(function (resolve, reject) {
    var tick = function () {
      if (window.bdms) return resolve(true);
      if (Date.now() - start > limit) {
        return reject(new Error('汽水安全组件未就绪'));
      }
      setTimeout(tick, 50);
    };
    tick();
  });
};

function cookieOf(name) {
  var parts = String(document.cookie || '').split(';');
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i].trim();
    var eq = part.indexOf('=');
    if (eq > 0 && part.slice(0, eq) === name) {
      try { return decodeURIComponent(part.slice(eq + 1)); } catch (e) { return part.slice(eq + 1); }
    }
  }
  return '';
}

function errorCodeOf(json) {
  if (!json) return -1;
  var data = json.data && typeof json.data === 'object' ? json.data : json;
  var code = Number(data.error_code == null ? json.error_code : data.error_code);
  return isNaN(code) ? -1 : code;
}

window.qsyyPassportPoll = async function (opts) {
  await window.qsyyWhenReady();
  var headers = Object.assign({}, opts.headers || {});
  delete headers.cookie;
  delete headers.Cookie;
  // 扫码后 passport 会比对 CSRF 请求头和实际随 XHR 发出的 Cookie，
  // 页面里的 Cookie 才是真正生效的那个，优先用它覆盖。
  var csrf = cookieOf('passport_csrf_token') || cookieOf('passport_csrf_token_default');
  if (csrf) headers['x-tt-passport-csrf-token'] = csrf;
  var result = await window.__qishuiRequest({
    method: 'POST',
    url: opts.postUrl,
    headers: headers,
    body: opts.body,
    timeout: 20000,
  });
  var json = parseJson(result.body);
  // POST 被风控判成“访问太频繁”时，GET 走的是另一套查询通道，值得补一次。
  if ((!json || errorCodeOf(json) === 7) && opts.getUrl) {
    var retry = await window.__qishuiRequest({
      method: 'GET',
      url: opts.getUrl,
      headers: headers,
      body: null,
      timeout: 20000,
    });
    var retryJson = parseJson(retry.body);
    if (!json || (retryJson && errorCodeOf(retryJson) !== 7)) {
      result = retry;
      json = retryJson;
    }
  }
  var aBogus = aBogusOf(result.responseURL || opts.postUrl || '');
  if (aBogus.length !== 44) {
    throw new Error('汽水安全签名生成失败：a_bogus 缺失（' + aBogus.length + ' 字符）');
  }
  var data = json && json.data && typeof json.data === 'object' ? json.data : json || {};
  var redirect = data.redirect_url || data.redirectUrl || '';
  var status = String(data.status == null ? '' : data.status).toLowerCase();
  if (redirect && (status === '3' || status === 'confirmed' || status === 'success')) {
    try {
      await window.__qishuiRequest({
        method: 'GET',
        url: redirect,
        headers: headers,
        body: null,
        timeout: 20000,
      });
    } catch (e) {}
  }
  return {
    status: result.status,
    json: json,
    text: result.body,
    responseURL: result.responseURL,
    aBogus: aBogus,
    signed: true,
    documentCookie: document.cookie || '',
    headers: result.headers || '',
  };
};
</script>
</head>
<body></body>
</html>
